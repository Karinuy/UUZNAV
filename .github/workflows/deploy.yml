name: Deploy to GitHub Repository

# 触发条件
on:
  # 当推送到 main 分支时触发
  push:
    branches:
      - main
  
  # 允许手动触发
  workflow_dispatch:

# 设置权限
permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      # 1. 检出源代码
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. 设置 Node.js 环境
      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 3. 安装依赖
      - name: 安装依赖
        run: npm ci

      # 4. 构建项目
      - name: 构建 Astro 项目
        run: npm run build

      # 5. 部署到目标仓库
      - name: 部署到目标仓库
        uses: peaceiris/actions-gh-pages@v3
        with:
          # 使用配置的 Personal Access Token
          personal_token: ${{ secrets.DEPLOY_TOKEN }}
          
          # 目标仓库配置
          external_repository: limulu24/anamew  # 修改为目标仓库
          publish_branch: main  # 目标分支，可改为 gh-pages
          publish_dir: ./dist   # Astro 构建输出目录
          
          # 可选配置
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'Deploy from source repository'
          
          # 保留 .git 历史（可选）
          keep_files: false
          
          # 强制推送（谨慎使用）
          force_orphan: false